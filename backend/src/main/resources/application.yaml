server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: teu-mobile-backend

  # 1. Cấu hình Datasource kết nối SQL Server 2022
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:teu_mobile_db};encrypt=true;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:TeuMobile@2026!}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 30000

  # 2. Cấu hình JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate # Nhường toàn quyền quản lý schema cho Flyway
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect

  # 3. Cấu hình Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

  # 4. Cấu hình Spring Security OAuth2 Resource Server
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${app.keycloak.base-url}/realms/${app.keycloak.realm}
          jwk-set-uri: ${app.keycloak.base-url}/realms/${app.keycloak.realm}/protocol/openid-connect/certs

# ========================================================
# 5. Các thông số cấu hình Keycloak & CORS đưa ra ngoài dễ quản lý
# ========================================================
app:
  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:teu-mobile-realm}
    client-id: ${KEYCLOAK_CLIENT_ID:teu-mobile-web}
    principal-attribute: preferred_username
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
    allowed-headers: "*"
    allow-credentials: true
